<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Profile Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>მოსწავლის პროფილი</h1>

    <div class="card">
      <h2>ბექა ბარათაშვილი</h2>
      <p>მე ვარ Front-end განვითარების კურსის სტუდენტი.</p>
      <p>მიყვარს ვებგვერდების აწყობა და ახალი ტექნოლოგიების სწავლა.</p>

      <div class="buttons">
        <button class="primary-btn">პროფილის ნახვა</button>
        <button class="secondary-btn">კონტაქტი</button>
      </div>
    </div>
  </div>
</body>
</html>
