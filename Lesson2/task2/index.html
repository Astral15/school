<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Product Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="product-card">
    <h1>Bluetooth ყურსასმენი</h1>

    <div class="content">
      <p class="description">
        უსადენო ყურსასმენი მაღალი ხმის ხარისხით და კომფორტული დიზაინით.
      </p>

      <p class="price">ფასი: 129 ლარი</p>

      <div class="buttons">
        <button class="buy-btn">ყიდვა</button>
        <button class="details-btn">დეტალურად</button>
      </div>
    </div>
  </div>
</body>
</html>
