<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome Page</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>მოგესალმებით ჩვენს გვერდზე</h1>
    <p class="intro">
      ეს არის პატარა Welcome Page, რომელიც აწყობილია HTML-ისა და SCSS-ის გამოყენებით.
    </p>

    <div class="box">
      <h2>დაიწყე სწავლა</h2>
      <p>
        გაიგე როგორ მუშაობს SCSS, როგორ ვიყენებთ variables-ს
        და როგორ ვწერთ უფრო სუფთა კოდს.
      </p>

      <div class="buttons">
        <button class="start-btn">დაწყება</button>
        <button class="more-btn">მეტის ნახვა</button>
      </div>
    </div>

    <p class="footer-text">დღევანდელი მიზანია უფრო სუფთად და გონივრულად წერა.</p>
  </div>
</body>
</html>
