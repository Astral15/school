 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Profile Page</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="logo">LearnSpace</div>

      <nav class="nav">
        <a href="#">Home</a>
        <a href="#">Courses</a>
        <a href="#">Profile</a>
      </nav>
    </header>

    <section class="profile-hero">
      <div class="profile-avatar">
        <div class="avatar-circle">N</div>
      </div>

      <div class="profile-content">
        <h1>Beka Baratashvili</h1>
        <p>Front-End Student</p>
        <button class="btn-primary">Edit Profile</button>
      </div>
    </section>

    <section class="info-grid">
      <div class="info-box lessons">
        <h3>Completed Lessons</h3>
        <span>12</span>
      </div>

      <div class="info-box courses">
        <h3>Active Courses</h3>
        <span>3</span>
      </div>

      <div class="info-box practice">
        <h3>Practice Hours</h3>
        <span>18</span>
      </div>
    </section>

    <section class="courses-grid">
      <article class="course-card">
        <div class="course-top">
          <h2>HTML Basics</h2>
          <span class="badge easy">Easy</span>
        </div>
        <p>Learn the structure of web pages and build your first layouts.</p>
        <button class="btn-primary">Continue</button>
      </article>

      <article class="course-card featured-card">
        <div class="course-top">
          <h2>SCSS Styling</h2>
          <span class="badge medium">Medium</span>
        </div>
        <p>Write cleaner SCSS and create reusable, organized styles.</p>
        <button class="btn-primary">Continue</button>
      </article>
    </section>

    <footer class="footer">
      <p>Student Profile Page</p>
    </footer>
  </div>
</body>
</html>

 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Course Catalog Page</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="logo">LearnSpace</div>

      <nav class="nav">
        <a href="#">Home</a>
        <a href="#">Courses</a>
        <a href="#">About</a>
      </nav>
    </header>

    <section class="hero">
      <h1>Explore Our Courses</h1>
      <p>Choose a course and continue your learning journey.</p>
      <button class="btn-primary">Browse All</button>
    </section>

    <section class="categories">
      <div class="category-box">HTML</div>
      <div class="category-box">SCSS</div>
      <div class="category-box">Responsive</div>
      <div class="category-box">JavaScript</div>
    </section>

    <section class="catalog-grid">
      <article class="course-card">
        <h2>HTML Basics</h2>
        <p>Learn structure, tags, forms, and semantic layout.</p>
        <span class="badge easy">Easy</span>
        <button class="btn-primary">Open</button>
      </article>

      <article class="course-card featured-card">
        <h2>SCSS Styling</h2>
        <p>Build reusable, cleaner, and more organized styles.</p>
        <span class="badge medium">Medium</span>
        <button class="btn-primary">Open</button>
      </article>

      <article class="course-card">
        <h2>Responsive Design</h2>
        <p>Make layouts look good on mobile, tablet, and desktop.</p>
        <span class="badge hard">Hard</span>
        <button class="btn-primary">Open</button>
      </article>

      <article class="course-card">
        <h2>JavaScript Basics</h2>
        <p>Start learning variables, functions, and interaction.</p>
        <span class="badge easy">Easy</span>
        <button class="btn-primary">Open</button>
      </article>

      <article class="course-card">
        <h2>CSS Grid</h2>
        <p>Build structured layouts using rows and columns.</p>
        <span class="badge medium">Medium</span>
        <button class="btn-primary">Open</button>
      </article>

      <article class="course-card">
        <h2>Flexbox Layout</h2>
        <p>Align and distribute content more easily across space.</p>
        <span class="badge easy">Easy</span>
        <button class="btn-primary">Open</button>
      </article>
    </section>

    <footer class="footer">
      <p>Course Catalog Page</p>
    </footer>
  </div>
</body>
</html>
